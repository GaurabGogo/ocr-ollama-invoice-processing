[project]
name = "bills-ocr"
version = "0.1.0"
description = "AI bill processing: OpenCV + Tesseract + Ollama + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
bills-ocr = "bills_ocr.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bills_ocr"]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
